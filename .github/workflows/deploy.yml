name: 🚀 Deploy Monorepo to o2switch Prod (FTP Rapide)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      # --- 1. COMPILATION DU FRONT (VITE) ---
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: 🛠️ Build Frontend
        working-directory: ./front 
        run: |
          npm ci
          npm run build

      # --- 2. TÉLÉVERSEMENT DES FICHIERS VIA FTP (SANS LES VENDOR) ---
      - name: 📂 Transfert global vers o2switch via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: blaireaudor/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/back/vendor/**
            **/back/var/**
            **/back/.env.local

      # --- 3. EXÉCUTION DES COMMANDES COMPOSER & SYMFONY SUR O2SWITCH ---
      - name: ⚙️ Déclencher l'installation sur le serveur
        run: |
          curl -kfsSL "https://api.blaireaudor.maximerose.com/deploy.php?secret=${{ secrets.DEPLOY_SECRET }}"