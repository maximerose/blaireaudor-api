name: 🚀 Deploy Monorepo to o2switch Prod (Full ZIP)

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      # --- 1. COMPILATION DU FRONT ---
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: 🛠️ Build Frontend
        working-directory: ./front 
        run: |
          npm ci
          npm run build

      # --- 2. PRÉPARATION DU BACK ---
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql

      - name: 🛠️ Installation des dépendances Back
        working-directory: ./back
        env:
          APP_ENV: prod
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      # --- 3. CRÉATION DE L'ARCHIVE GLOBALE ---
      - name: 🗜️ Création du ZIP global
        run: zip -r deploy.zip front/dist back -x "back/var/*" "back/.env.local" "back/.git/*"

      # --- 4. TRANSFERT FTP D'UN SEUL FICHIER ---
      - name: 📂 Transfert du ZIP vers o2switch
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: /blaireaudor/
          exclude: |
            **/*
            !deploy.zip

      # --- 5. DÉCLENCHEMENT DU WEBHOOK ---
      - name: ⚙️ Exécuter le Webhook sur o2switch
        continue-on-error: true
        run: curl --http1.1 -kfsSL "https://api.blaireaudor.maximerose.com/webhook_api.php?secret=${{ secrets.DEPLOY_SECRET }}"