name: Deploy to o2switch

on:
  push:
    branches:
      - main # ou master selon la branche principale de ton repo

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Adapte selon ta version de PHP
          extensions: mbstring, intl, pdo_mysql

      - name: Install Composer dependencies
        working-directory: ./back
        # Installe les paquets de prod et optimise l'autoloader
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Clear Symfony cache
        working-directory: ./back
        run: APP_ENV=prod php bin/console cache:clear

      - name: Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./back/
          server-dir: ./back/
          # On exclut les dossiers lourds et inutiles en prod
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

  deploy-frontend:
    runs-on: ubuntu-latest
    # On s'assure que le frontend se déploie en parallèle ou après
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Résout le warning Node.js que tu avais !

      - name: Install dependencies and build
        working-directory: ./front
        run: |
          npm install
          npm run build

      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./front/dist/
          server-dir: ./front/dist/