name: Deploy to o2switch

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql

      - name: Create fake .env for cache warmup
        working-directory: ./back
        run: |
          echo 'APP_ENV=prod' > .env.local
          echo 'DATABASE_URL="mysql://fake_user:fake_password@127.0.0.1:3306/fake_db?serverVersion=10.11.2-MariaDB"' >> .env.local

      - name: Install Composer dependencies
        working-directory: ./back
        run: APP_ENV=prod composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Clear Symfony cache
        working-directory: ./back
        run: APP_ENV=prod php bin/console cache:clear

      - name: Clean up unused files
        run: rm -rf ./back/node_modules ./back/.git

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy Backend via native LFTP
        # On passe les identifiants via l'environnement pour sécuriser les caractères spéciaux
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" -e "set ssl:verify-certificate no; mirror -R -v --parallel=10 --ignore-time --exclude-glob tests/ --exclude-glob var/log/ --exclude-glob var/cache/ --exclude-glob .git/ --exclude .env.local ./back/ back/; quit" "$FTP_HOST"

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and build
        working-directory: ./front
        env:
          VITE_API_BASE_URL: https://api.blaireaudor.maximerose.com/api
          VITE_ADMIN_URL: https://api.blaireaudor.maximerose.com/admin
          VITE_VAPID_PUBLIC_KEY: BFShZ7lm_kpjRnkDRILuBgkNbLHrmdFpnwpZSqFwuHzN8T1Cj9_EdvE1HPD_ygwb7cGjFbjb9ZRqqCJ6T75X8zY
          VITE_MERCURE_PUBLIC_URL: https://blaireaudor-mercure.onrender.com/.well-known/mercure
        run: |
          npm install
          npm run build

      - name: Clean up unused files
        run: rm -rf ./front/node_modules ./front/.git

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy Frontend via native LFTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" -e "set ssl:verify-certificate no; mirror -R -v --parallel=10 --ignore-time --exclude-glob .git/ ./front/dist/ front/dist/; quit" "$FTP_HOST"

  trigger-production-webhook:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - name: Call Webhook to clear remote cache and run migrations
        run: |
          curl -sS --http1.1 "https://api.blaireaudor.maximerose.com/webhook_api.php?secret=${{ secrets.DEPLOY_SECRET }}" || [ $? -eq 56 ]
