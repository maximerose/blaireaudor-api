name: 🚀 Deploy Monorepo to o2switch Prod

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      # --- 1. CONFIGURATION & COMPILATION DU FRONT (VITE) ---
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: 🛠️ Build Frontend
        working-directory: ./front 
        run: |
          npm ci
          npm run build

      # --- 2. OUVERTURE AUTOMATIQUE DU PARE-FEU O2SWITCH ---
      - name: 🌐 Récupérer l'IP du robot GitHub
        id: ip
        uses: haythem/public-ip@v1.3

      - name: 🔓 Autoriser l'IP du robot sur o2switch
        run: |
          # 1. Obtenir les en-têtes de connexion pour intercepter le jeton de session (cpsess)
          REDIRECT_HEADERS=$(curl -sI -u "${{ secrets.O2SWITCH_USER }}:${{ secrets.O2SWITCH_PASSWORD }}" "https://${{ secrets.O2SWITCH_HOST }}:2083/")
          
          # 2. Extraire le jeton dynamique généré par cPanel
          TOKEN=$(echo "$REDIRECT_HEADERS" | grep -io 'cpsess[0-9]*' | head -n 1)
          
          if [ -z "$TOKEN" ]; then
            echo "❌ Erreur : Impossible de récupérer le jeton de session cPanel. Vérifie tes secrets O2SWITCH_USER et O2SWITCH_PASSWORD."
            exit 1
          fi
          
          echo "🔑 Jeton de session sécurité intercepté : $TOKEN"
          
          # 3. Appeler le plugin d'o2switch au bon endroit avec son jeton pour valider l'IP
          curl -sX GET -u "${{ secrets.O2SWITCH_USER }}:${{ secrets.O2SWITCH_PASSWORD }}" "https://${{ secrets.O2SWITCH_HOST }}:2083/${TOKEN}/frontend/o2switch/o2switch-ssh-whitelist/index.live.php?ip=${{ steps.ip.outputs.ipv4 }}&action=add"
          
          echo "⏳ Attente de 10 secondes pour la propagation du pare-feu..."
          sleep 10

      # --- 3. SYNCHRONISATION DES FICHIERS (RSYNC) ---
      - name: 📂 Transfert vers o2switch
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.O2SWITCH_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.O2SWITCH_HOST }}
          REMOTE_USER: ${{ secrets.O2SWITCH_USER }}
          REMOTE_PORT: 22
          SOURCE: "./"
          TARGET: "/home2/${{ secrets.O2SWITCH_USER }}/blaireaudor/"
          EXCLUDE: "/.git/, /.github/, /front/node_modules/, /back/vendor/, /back/var/, /back/.env.local"

      # --- 4. SCRIPTS SYMFONY SUR LE SERVEUR ---
      - name: ⚙️ Post-Déploiement Symfony
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: 22
          script: |
            cd /home2/${{ secrets.O2SWITCH_USER }}/blaireaudor/back
            composer install --no-dev --optimize-autoloader --no-interaction
            php bin/console cache:clear --env=prod
            php bin/console doctrine:migrations:migrate -n --env=prod
            php bin/console lexik:jwt:generate-keypair --skip-if-exists