name: Deploy to o2switch

on:
  push:
    branches:
      - main # ou master selon la branche principale de ton repo

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Adapte selon ta version de PHP
          extensions: mbstring, intl, pdo_mysql

      - name: Install Composer dependencies
        working-directory: ./back
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Clear Symfony cache
        working-directory: ./back
        run: APP_ENV=prod php bin/console cache:clear

      - name: Clean up unused files
        run: rm -rf ./back/node_modules ./back/.git

      - name: Deploy Backend via FTP
        uses: appleboy/ftp-action@master
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./back/
          server-dir: ./back/

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install dependencies and build
        working-directory: ./front
        run: |
          npm install
          npm run build

      - name: Deploy Frontend via FTP
        uses: appleboy/ftp-action@master
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./front/dist/
          server-dir: ./front/dist/