name: 🚀 Deploy Monorepo to o2switch Prod (FTP)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      # --- 1. COMPILATION DU FRONT (VITE) ---
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: 🛠️ Build Frontend
        working-directory: ./front 
        run: |
          npm ci
          npm run build

      # --- 2. PRÉPARATION DU BACK (COMPOSER PROD) ---
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql

      - name: 🛠️ Build Backend (Symfony Prod)
        working-directory: ./back
        env:
            APP_ENV: prod
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      # --- 3. TÉLÉVERSEMENT DES FICHIERS VIA FTP ---
      - name: 📂 Transfert global vers o2switch via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          password: ${{ secrets.O2SWITCH_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: blaireaudor/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/back/var/**
            **/back/.env.local

      # --- 4. EXÉCUTION DES COMMANDES SYMFONY VIA LE WEB ---
      - name: ⚙️ Exécution du script post-déploiement
        run: |
          curl -fsSL "https://api.blaireaudor.maximerose.com/deploy.php?secret=BlaireauDorFaitDuDevOpsEn2026"