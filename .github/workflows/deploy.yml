name: Deploy to o2switch

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql

      - name: Create fake .env for cache warmup
        working-directory: ./back
        run: |
          echo 'APP_ENV=prod' > .env.local
          echo 'DATABASE_URL="mysql://fake_user:fake_password@127.0.0.1:3306/fake_db?serverVersion=10.11.x-MariaDB"' >> .env.local
          
      - name: Install Composer dependencies
        working-directory: ./back
        run: APP_ENV=prod composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: Clear Symfony cache
        working-directory: ./back
        run: APP_ENV=prod php bin/console cache:clear

      - name: Clean up unused files
        run: rm -rf ./back/node_modules ./back/.git

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy Backend via native LFTP
        # On passe les identifiants via l'environnement pour sécuriser les caractères spéciaux
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" -e "set ssl:verify-certificate no; mirror -R -v ./back/ back/; quit" "$FTP_HOST"

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        working-directory: ./front
        run: |
          npm install
          npm run build

      - name: Clean up unused files
        run: rm -rf ./front/node_modules ./front/.git

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy Frontend via native LFTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" -e "set ssl:verify-certificate no; mirror -R -v ./front/dist/ front/dist/; quit" "$FTP_HOST"