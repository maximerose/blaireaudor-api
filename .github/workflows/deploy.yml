name: 🚀 Deploy Monorepo to o2switch Prod

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      # --- 1. CONFIGURATION & COMPILATION DU FRONT (VITE) ---
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: 🛠️ Build Frontend
        working-directory: ./front  # Indique à GitHub d'aller dans ton dossier front
        run: |
          npm ci
          npm run build

      # --- 2. SYNCHRONISATION DES FICHIERS (RSYNC) ---
      - name: 📂 Transfert vers o2switch
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.O2SWITCH_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.O2SWITCH_HOST }}
          REMOTE_USER: ${{ secrets.O2SWITCH_USER }}
          SOURCE: "./" # On synchronise TOUT le monorepo (front + back + config)
          TARGET: "/home/${{ secrets.O2SWITCH_USER }}/blaireaudor/"
          EXCLUDE: "/.git/, /.github/, /front/node_modules/, /back/vendor/, /back/var/, /back/.env.local"

      # --- 3. SCRIPTS SYMFONY SUR LE SERVEUR ---
      - name: ⚙️ Post-Déploiement Symfony
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          script: |
            cd /home2/${{ secrets.O2SWITCH_USER }}/blaireaudor/back
            
            # Installation propre des dépendances PHP de prod
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Gestion du cache et des bases de données
            php bin/console cache:clear --env=prod
            php bin/console doctrine:migrations:migrate -n --env=prod
            php bin/console lexik:jwt:generate-keypair --skip-if-exists