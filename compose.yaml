services:
  back:
    build: ./back
    command: php -S 0.0.0.0:8000 -t public
    tty: true
    env_file:
      - ./back/.env.local
    depends_on:
      database:
        condition: service_healthy
      mailer: 
        condition: service_healthy
    ports:
      - "8080:8000"
    volumes:
      - ./back:/app
      - .:/workspace
      - /tmp:/tmp
    working_dir: /app

  front:
    build: ./front
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
  
  quality:
    build: 
      context: .
      dockerfile: docker/quality/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    profiles: ["tools"]
    stdin_open: true
    tty: true

  database:
    image: mariadb:10.11
    env_file:
      - ./back/.env.local
    ports:
    - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 10s 
    volumes:
      - database_data:/var/lib/mysql:rw

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/"]
      timeout: 3s
      retries: 3

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    ports:
      - "9090:80"
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:5173 http://localhost:4173 http://127.0.0.1:5173 http://127.0.0.1:4173
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  database_data:
  mercure_data:
  mercure_config: